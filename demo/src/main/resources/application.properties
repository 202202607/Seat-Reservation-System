spring.application.name=demo

spring.datasource.url=jdbc:oracle:thin:@localhost:1521/FREEPDB1
spring.datasource.username=demo_user
spring.datasource.password="DemoPass123!"
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 운영에서는 환경 변수 JWT_SECRET(Base64, 32바이트 이상)을 반드시 설정한다. 아래 기본값은 로컬 개발용이다.
app.jwt.secret=${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}

# 관리자 회원가입 코드 (US-01 AC5). 비어 있으면 관리자 가입이 막힌다. 코드는 저장소에 넣지 말고 환경 변수로 준다.
app.admin.signup-code=${ADMIN_SIGNUP_CODE:}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

#실제 서비스때는 변경해야함
app.base-url=http://localhost:8080

# 평상시 좌석 예약 정책 (US-05, 설계서 p.10). 코드에 하드코딩하지 않고 여기서 읽는다.
# 시험 기간 정책(US-18)은 Policy 테이블에서 읽도록 PolicyService 에서 확장한다.
app.reservation.policy.max-advance-days=7
app.reservation.policy.max-reservation-hours=4
app.reservation.policy.open-time=09:00
app.reservation.policy.close-time=22:00
app.reservation.policy.slot-minutes=30